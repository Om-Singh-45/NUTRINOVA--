<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NutriNova AI - Login & Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-void:    #03050f;
      --bg-surface: #0b0f1e;
      --bg-raised:  #111629;
      --teal:   #00ffc8;
      --blue:   #0ea5ff;
      --lime:   #a8ff3e;
      --text-bright: #ffffff;
      --text-body:   #d4deff;
      --text-muted:  #8fa3cc;
      --border-dim:    rgba(0,255,200,0.10);
      --border-mid:    rgba(0,255,200,0.22);
      --border-bright: rgba(0,255,200,0.45);
      --radius-md: 18px;
      --radius-lg: 28px;
      --font-display: 'Syne', sans-serif;
      --font-body:    'DM Sans', sans-serif;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    
    body {
      font-family: var(--font-body);
      background: var(--bg-void);
      color: var(--text-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Background effects */
    .aurora { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
    .aurora-blob { position:absolute; border-radius:50%; filter:blur(120px); mix-blend-mode:screen; animation:aurora-drift 18s ease-in-out infinite; }
    .ab1 { width:700px;height:700px; background:rgba(0,255,200,0.06); top:-20%;left:-15%; }
    .ab2 { width:600px;height:600px; background:rgba(14,165,255,0.07); bottom:-20%;right:-15%; animation-delay:5s; }
    @keyframes aurora-drift {
      0%,100%{ transform:translate(0,0) scale(1); }
      33%{ transform:translate(80px,100px) scale(1.12); }
      66%{ transform:translate(-60px,50px) scale(0.92); }
    }

    /* Auth Container */
    .auth-container {
      position: relative;
      z-index: 1;
      max-width: 480px;
      width: 90%;
      padding: 48px;
      background: linear-gradient(145deg, rgba(17,22,41,0.95), rgba(11,15,30,0.98));
      border: 1px solid var(--border-dim);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 60px rgba(0,0,0,0.7), 0 4px 16px rgba(0,0,0,0.5);
      animation: fadeUp 0.6s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .auth-logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .auth-hex {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--teal), var(--blue));
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3em;
    }

    .auth-brand {
      font-family: var(--font-display);
      font-size: 1.5em;
      font-weight: 800;
      color: var(--text-bright);
    }

    .auth-brand span {
      color: var(--teal);
    }

    .auth-title {
      font-family: var(--font-display);
      font-size: 1.8em;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 8px;
    }

    .auth-subtitle {
      font-size: 0.9em;
      color: var(--text-muted);
    }

    /* Tabs */
    .auth-tabs {
      display: flex;
      gap: 2px;
      margin-bottom: 32px;
      background: rgba(0, 255, 200, 0.03);
      border-radius: var(--radius-md);
      padding: 4px;
    }

    .auth-tab {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-display);
      font-size: 0.95em;
      font-weight: 600;
      cursor: pointer;
      border-radius: calc(var(--radius-md) - 4px);
      transition: all 0.3s ease;
    }

    .auth-tab.active {
      background: linear-gradient(135deg, rgba(0,255,200,0.12), rgba(14,165,255,0.12));
      color: var(--teal);
      border: 1px solid var(--border-mid);
    }

    .auth-tab:hover:not(.active) {
      color: var(--text-body);
    }

    /* Forms */
    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-family: var(--font-body);
      font-size: 0.85em;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .form-input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(0, 255, 200, 0.03);
      border: 1px solid var(--border-mid);
      border-radius: var(--radius-md);
      color: var(--text-bright);
      font-family: var(--font-body);
      font-size: 0.95em;
      transition: all 0.3s ease;
    }

    .form-input::placeholder {
      color: var(--text-muted);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--teal);
      background: rgba(0, 255, 200, 0.05);
      box-shadow: 0 0 0 4px rgba(0, 255, 200, 0.09);
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      margin-top: 24px;
      background: linear-gradient(135deg, var(--teal), var(--blue));
      border: none;
      border-radius: var(--radius-md);
      color: var(--bg-void);
      font-family: var(--font-display);
      font-size: 1em;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 255, 200, 0.3);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      padding: 12px 16px;
      background: rgba(255, 80, 80, 0.07);
      border: 1px solid rgba(255, 80, 80, 0.22);
      border-radius: var(--radius-md);
      color: #ffb3b3;
      font-size: 0.9em;
      margin-bottom: 20px;
      display: none;
    }

    .error-message.show {
      display: block;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .success-message {
      padding: 12px 16px;
      background: rgba(0, 255, 200, 0.07);
      border: 1px solid rgba(0, 255, 200, 0.22);
      border-radius: var(--radius-md);
      color: var(--teal);
      font-size: 0.9em;
      margin-bottom: 20px;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    .back-link {
      text-align: center;
      margin-top: 24px;
    }

    .back-link a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9em;
      transition: color 0.3s;
    }

    .back-link a:hover {
      color: var(--teal);
    }

    @media (max-width: 600px) {
      .auth-container {
        padding: 32px 24px;
      }
      
      .auth-title {
        font-size: 1.5em;
      }
    }
  </style>
</head>
<body>
  <div class="aurora">
    <div class="aurora-blob ab1"></div>
    <div class="aurora-blob ab2"></div>
  </div>

  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-logo">
        <div class="auth-hex">🌿</div>
        <div class="auth-brand">Nutri<span>Nova</span></div>
      </div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to access your nutrition insights</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" onclick="switchTab('register')">Register</button>
    </div>

    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>

    <!-- Login Form -->
    <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Username or Email</label>
        <input type="text" class="form-input" id="loginUsername" placeholder="Enter username or email" required />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="loginPassword" placeholder="Enter password" required />
      </div>
      <button type="submit" class="submit-btn" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" class="form-input" id="regUsername" placeholder="Choose a username" required minlength="3" />
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="regEmail" placeholder="Enter your email" required />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="regPassword" placeholder="Create a password (min 6 characters)" required minlength="6" />
      </div>
      <button type="submit" class="submit-btn" id="registerBtn">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
    </form>

    <div class="back-link">
      <a href="/"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
  </div>

  <script>
    const API_URL = 'http://127.0.0.1:5000';

    function switchTab(tab) {
      // Update tabs
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');

      // Update forms
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      if (tab === 'login') {
        document.getElementById('loginForm').classList.add('active');
      } else {
        document.getElementById('registerForm').classList.add('active');
      }

      // Clear messages
      hideMessages();
    }

    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
      document.getElementById('successMessage').classList.remove('show');
    }

    function showSuccess(message) {
      const successDiv = document.getElementById('successMessage');
      successDiv.textContent = message;
      successDiv.classList.add('show');
      document.getElementById('errorMessage').classList.remove('show');
    }

    function hideMessages() {
      document.getElementById('errorMessage').classList.remove('show');
      document.getElementById('successMessage').classList.remove('show');
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideMessages();

      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

      try {
        const response = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('loginUsername').value,
            password: document.getElementById('loginPassword').value
          })
        });

        const data = await response.json();

        if (response.ok) {
          showSuccess('Login successful! Redirecting...');
          setTimeout(() => {
            window.location.href = '/';
          }, 1000);
        } else {
          showError(data.error || 'Login failed');
        }
      } catch (error) {
        showError('Connection error. Please ensure the server is running.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideMessages();

      const btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

      try {
        const response = await fetch(`${API_URL}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('regUsername').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value
          })
        });

        const data = await response.json();

        if (response.ok) {
          showSuccess(data.message || 'Registration successful! Please log in.');
          // Switch to login tab after successful registration
          setTimeout(() => {
            document.querySelector('.auth-tab').click();
            // Pre-fill username
            document.getElementById('loginUsername').value = document.getElementById('regUsername').value;
            document.getElementById('loginPassword').focus();
          }, 1500);
        } else {
          showError(data.error || 'Registration failed');
        }
      } catch (error) {
        showError('Connection error. Please ensure the server is running.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
      }
    }
  </script>
</body>
</html>
